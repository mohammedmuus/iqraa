name: iqraa
description: Iqraa, authentic Islamic books in Arabic, Kiswahili and English.
publish_to: "none"
version: 1.0.12+13

environment:
  sdk: ">=3.12.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  app_links: ^7.2.2
  crypto: ^3.0.8
  flutter_custom_tabs: ^2.6.0
  flutter_local_notifications: ^23.0.2
  flutter_localizations:
    sdk: flutter
  flutter_secure_storage: ^11.2.0
  freerasp: ^8.3.0
  intl: ^0.20.3
  just_audio: ^0.10.6
  just_audio_background: ^0.0.1-beta.17
  local_auth: ^3.0.2
  package_info_plus: ^10.2.2
  path_provider: ^2.1.5
  share_plus: ^13.3.1
  shared_preferences: ^2.5.6
  timezone: ^0.11.0
  url_launcher: ^6.3.3
  workmanager: ^0.10.10

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/pay/
  fonts:
    - family: InstrumentSans
      fonts:
        - asset: assets/fonts/InstrumentSans_400Regular.ttf
          weight: 400
        - asset: assets/fonts/InstrumentSans_500Medium.ttf
          weight: 500
        - asset: assets/fonts/InstrumentSans_600SemiBold.ttf
          weight: 600
    - family: Amiri
      fonts:
        - asset: assets/fonts/Amiri_400Regular.ttf
          weight: 400
        - asset: assets/fonts/Amiri_700Bold.ttf
          weight: 700
